spring:
  config:
    activate:
      on-profile: mongo
  data:
    mongodb:
      uri: ${WORKFLOW_MONGODB_URI}
      database: ${WORKFLOW_MONGODB_DATABASE}
      auto-index-creation: false

workflow:
  persistence:
    provider: mongodb
    index-manifest: classpath:mongo-indexes-v1.json

management:
  health:
    mongo:
      enabled: true
